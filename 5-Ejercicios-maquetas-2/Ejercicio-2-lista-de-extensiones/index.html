<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extensiones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="header__logo" href="#" aria-label="Extensiones, inicio">
        <svg class="header__logo-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5"/><circle cx="24" cy="12" r="6.5"/>
          <circle cx="12" cy="24" r="6.5"/><circle cx="24" cy="24" r="6.5"/>
        </svg>
        <span class="header__title">Extensiones</span>
      </a>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Cambiar a tema claro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <main>
      <div class="toolbar">
        <h1 class="toolbar__title">Lista de extensiones</h1>
        <div class="filters" role="group" aria-label="Filtrar extensiones">
          <button class="filters__btn" type="button" data-filter="all" aria-pressed="true">Todas</button>
          <button class="filters__btn" type="button" data-filter="active" aria-pressed="false">Activas</button>
          <button class="filters__btn" type="button" data-filter="inactive" aria-pressed="false">Inactivas</button>
        </div>
      </div>

      <ul class="grid" id="grid" aria-live="polite"></ul>
      <p class="empty" id="empty" hidden>No hay extensiones para mostrar.</p>
    </main>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
