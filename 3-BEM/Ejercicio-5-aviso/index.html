<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ejercicio 5 · Bloque aviso</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <main class="pagina">
    <section class="seccion">
      <h1 class="seccion__titulo">Ejercicio 5 · Bloque aviso</h1>
      <div class="aviso aviso--exito" role="status">
        <p class="aviso__texto"><strong>¡Hecho!</strong> Los cambios se han guardado correctamente.</p>
        <button class="aviso__cerrar" type="button" aria-label="Cerrar aviso">×</button>
      </div>
      <div class="aviso aviso--error" role="alert">
        <p class="aviso__texto"><strong>Error.</strong> No se ha podido enviar el formulario.</p>
        <button class="aviso__cerrar" type="button" aria-label="Cerrar aviso">×</button>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>

</html>
