<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de Frontend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    /* Aplica el tema antes de pintar para evitar parpadeo */
    (function () {
      var t = null;
      try { t = localStorage.getItem('quiz-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="page__header">
      <div class="theme-switch">
        <svg class="theme-switch__icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <button class="theme-switch__btn" type="button" role="switch" aria-checked="true" aria-label="Tema oscuro">
          <span class="theme-switch__thumb"></span>
        </button>
        <svg class="theme-switch__icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </div>
    </header>

    <main class="quiz">
      <section class="quiz__intro">
        <h1 class="quiz__title">Bienvenido al <strong>¡Quiz de Frontend!</strong></h1>
        <p class="quiz__subtitle">Elige una materia para empezar.</p>
      </section>

      <nav class="quiz__options" aria-label="Materias del quiz">
        <ul class="options">
          <li><a class="option" href="#html">
            <span class="option__icon option__icon--html"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 5l-4 14"/></svg></span>
            <span class="option__label">HTML</span></a></li>
          <li><a class="option" href="#css">
            <span class="option__icon option__icon--css"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v7H6zM9 3v3M12 3v3M15 3v3M9 10v3h6v-3M12 13v8"/></svg></span>
            <span class="option__label">CSS</span></a></li>
          <li><a class="option" href="#javascript">
            <span class="option__icon option__icon--js"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v6a2 2 0 0 1-4 0M16.5 10.5c-1.5-1-3 0-2.5 1.2.5 1.2 3 .8 2.8 2.3-.2 1.4-2 1.7-3.2.7"/></svg></span>
            <span class="option__label">Javascript</span></a></li>
          <li><a class="option" href="#accesibilidad">
            <span class="option__icon option__icon--a11y"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"/><path d="M4 8.5l8 1.5 8-1.5M12 10v4.5M12 14.5l-3.5 6M12 14.5l3.5 6"/></svg></span>
            <span class="option__label">Accesibilidad</span></a></li>
        </ul>
      </nav>
    </main>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
