<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obtén ideas que hagan crecer tu negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="card">
    <figure class="card__media" role="img" aria-label="Equipo de personas trabajando con portátiles en una mesa">
      <img class="card__art" src="images/equipo.jpg" alt="Equipo de personas trabajando con portátiles en una mesa">
    </figure>

    <div class="card__content">
      <h1 class="card__title">Obtén <span class="card__highlight">ideas</span> que hagan crecer tu negocio.</h1>
      <p class="card__text">Descubre los beneficios del análisis de datos y toma mejores decisiones sobre ingresos, experiencia del cliente y eficiencia general.</p>
      <dl class="stats">
        <div class="stats__item"><dt class="stats__label">Empresas</dt><dd class="stats__value" data-target="10" data-suffix="k+">10k+</dd></div>
        <div class="stats__item"><dt class="stats__label">Plantillas</dt><dd class="stats__value" data-target="314" data-suffix="">314</dd></div>
        <div class="stats__item"><dt class="stats__label">Consultas</dt><dd class="stats__value" data-target="12" data-suffix="M+">12M+</dd></div>
      </dl>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
